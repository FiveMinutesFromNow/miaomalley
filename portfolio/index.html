<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mia O'Malley — Portfolio</title>
<style>
  :root{
    --bg:#FBFAF8;
    --card:#FFFFFF;
    --border:#ECEAE6;
    --ink:#1A1A1A;
    --muted:#9A968F;
    --muted2:#B8B4AD;
    --accent:#7BA7A9;
    --pill:#F3F1ED;
    --radius:22px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    padding:40px 20px 80px;
  }
  .wrap{max-width:1060px;margin:0 auto}
  section{margin-top:28px}
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:34px 38px;
  }

  /* ---------- HEADER ---------- */
  .header{display:flex;align-items:flex-start;gap:26px;flex-wrap:wrap}
  .avatar{
    width:118px;height:118px;border-radius:50%;
    object-fit:cover;flex:0 0 auto;
    border:4px solid #fff;box-shadow:0 0 0 1px var(--border);
    background:#E9E6E1;
    display:flex;align-items:center;justify-content:center;
    font-size:38px;font-weight:600;color:#8A8680;
  }
  .id{flex:1 1 240px;min-width:220px}
  .id h1{font-size:44px;line-height:1.05;font-weight:700;letter-spacing:-.5px}
  .id .handle{color:var(--muted);font-size:19px;margin-top:6px}
  .id .loc{color:var(--muted2);font-size:15px;margin-top:2px}
  .right{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:16px}
  .audience{display:flex;align-items:center;gap:22px;flex-wrap:wrap;justify-content:flex-end}
  .total .n{font-size:34px;font-weight:700;letter-spacing:-.5px}
  .total .l{font-size:12px;color:var(--muted)}
  .divider{width:1px;height:52px;background:var(--border)}
  .plat{text-align:center;min-width:64px;color:inherit;text-decoration:none;display:block;transition:opacity .15s}
  a.plat:hover{opacity:.6}
  .plat .icon{width:26px;height:26px;margin:0 auto 6px;display:block}
  .plat .n{font-size:16px;font-weight:600}
  .plat .h{font-size:11px;color:var(--muted2);margin-top:1px}
  .contactbox{
    border:1px solid var(--border);border-radius:16px;padding:16px 20px;
    text-align:right;width:320px;background:#fff
  }
  .contactbox .lbl{color:var(--muted2);font-size:12px;text-transform:uppercase;letter-spacing:.04em}
  .contactbox .name{font-size:16px;font-weight:600;margin-top:3px}
  .contactbox a{color:var(--accent);font-size:15px;text-decoration:none;word-break:break-word}

  /* ---------- SECTION TITLES ---------- */
  h2.sec{font-size:26px;font-weight:700;margin-bottom:18px;letter-spacing:-.3px}

  /* ---------- COLLABS ---------- */
  .collabs{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
  .collab{border:1px solid var(--border);border-radius:16px;overflow:hidden;background:#fff;display:block;color:inherit;text-decoration:none;transition:box-shadow .15s}
  a.collab:hover{box-shadow:0 4px 16px rgba(0,0,0,.08)}
  .collab .thumb{
    aspect-ratio:4/5;background:#F1EEE9;
    display:flex;align-items:center;justify-content:center;
    color:var(--muted2);font-size:13px;
    background-size:cover;background-position:center
  }
  .collab .cap{padding:14px 16px}
  .collab .cap .b{font-size:15px;font-weight:600}
  .collab .cap .c{font-size:13px;color:var(--muted);margin-top:2px}

  /* ---------- INSTAGRAM EMBEDS ---------- */
  .embeds{display:grid;gap:16px;justify-items:stretch}
  .embeds.cols4{grid-template-columns:repeat(4,1fr)}
  .embeds.cols3{grid-template-columns:repeat(3,1fr)}
  .scalebox{position:relative;overflow:hidden;border-radius:12px;border:1px solid var(--border);background:#fff}
  .scalebox .ig-embed,
  .scalebox .ig-poster{
    position:absolute;top:0;left:0;
    width:480px;height:735px;max-width:none;
    transform-origin:top left;
    border:0;border-radius:0
  }
  @media(max-width:720px){ .embeds.cols4,.embeds.cols3{grid-template-columns:repeat(2,1fr)} }
  @media(max-width:460px){ .embeds.cols4,.embeds.cols3{grid-template-columns:1fr} }
  .ig-embed{width:480px;height:735px;background:#fff;display:block}
  .ig-poster{
    width:480px;height:735px;
    background:#fff;
    display:flex;flex-direction:column;overflow:hidden;
    text-decoration:none;color:inherit;transition:box-shadow .15s
  }
  .ig-poster:hover{box-shadow:0 4px 16px rgba(0,0,0,.08)}
  .ig-poster .media{flex:1;min-height:0;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .ig-poster .media img{max-width:100%;max-height:100%;object-fit:contain;display:block}
  .ig-poster .media .ph{color:#fff;opacity:.7;font-size:14px;text-align:center;line-height:1.6}
  .ig-poster .media .ph .tri{font-size:30px;display:block}
  .ig-poster .pfoot{
    display:flex;align-items:center;justify-content:center;gap:8px;
    padding:13px;font-weight:600;font-size:13.5px;color:var(--accent);
    border-top:1px solid var(--border);flex:0 0 auto
  }
  @media(max-width:720px){ .embeds{grid-template-columns:1fr} }

  /* ---------- ABOUT (inside header card, above contact box) ---------- */
  .about-inline{
    width:320px;font-size:13.5px;line-height:1.55;color:#3a3a3a;text-align:left;
  white-space:pre-line}

  /* ---------- RATES ---------- */
  .rates-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:4px}
  .rate{
    border:1px solid var(--border);border-radius:16px;
    padding:22px 24px;display:flex;align-items:center;justify-content:space-between;gap:14px;
  }
  .rate .rl{font-size:18px;font-weight:600}
  .rate .rs{font-size:13px;color:var(--muted);margin-top:3px}
  .rate .rp{
    background:var(--pill);border-radius:12px;padding:12px 18px;
    font-size:16px;font-weight:600;white-space:nowrap
  }
  .rate-note{font-size:13px;color:var(--muted);margin-top:16px}

  /* ---------- ANALYTICS NOTE ---------- */
  .analytics{text-align:center;color:var(--muted);font-size:15px;padding:22px}

  .foot{text-align:center;color:var(--muted2);font-size:12.5px;margin-top:34px}

  @media(max-width:820px){
    .collabs{grid-template-columns:1fr 1fr}
    .rates-grid{grid-template-columns:1fr}
    .right{margin-left:0;align-items:flex-start;width:100%}
    .audience{justify-content:flex-start}
    .contactbox{text-align:left;width:100%}
    .about-inline{width:100%}
    .card{padding:26px 22px}
  }
</style>
</head>

const TT_ICON  = "data:image/svg+xml;utf8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#1A1A1A"><path d="M16.5 3c.3 2 1.6 3.5 3.5 3.8v2.5c-1.3 0-2.5-.4-3.5-1v5.9c0 3.2-2.4 5.3-5.3 5.3A5.2 5.2 0 0 1 6 14.3c0-3 2.5-5.2 5.6-4.9v2.6a2.5 2.5 0 0 0-1-.2 2.5 2.5 0 1 0 2.5 2.5V3h3.4z"/></svg>');
const FB_ICON  = "data:image/svg+xml;utf8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="#1A1A1A"><path d="M13.5 21v-8h2.6l.4-3h-3V8.1c0-.9.3-1.5 1.6-1.5H17V4c-.3 0-1.3-.1-2.4-.1-2.4 0-4 1.4-4 4.1V10H8v3h2.6v8h2.9z"/></svg>');

function fmt(n){
  if(n===null||n===undefined) return "0";
  if(typeof n==="string") return n;
  if(n>=1000000) return (n/1000000).toFixed(2).replace(/\.00$/,'')+"M";
  if(n>=1000){ const k=n/1000; return (Number.isInteger(k)?k:k.toFixed(1))+"K"; }
  return String(n);
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}

function render(){
  const d = DATA;
  const ig=d.socials.instagram.followers||0, tt=d.socials.tiktok.followers||0, fb=d.socials.facebook.followers||0;
  const total = ig+tt+fb;

  const header = `
  <section class="card">
    <div class="header">
    <img class="avatar" src="${esc(d.photo)}" alt="${esc(d.name)}"
         onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'avatar',textContent:'${esc(d.name.split(' ').map(w=>w[0]).join('').slice(0,2))}'}))">
    <div class="id">
      <h1>${esc(d.name)}</h1>
      <div class="handle">${esc(d.handle)}</div>
      <div class="loc">${esc(d.location)}</div>
    </div>
    <div class="right">
      <div class="audience">
        <div class="total"><div class="n">${fmt(total)}</div><div class="l">Total Following</div></div>
        <div class="divider"></div>
        <a class="plat" href="${esc(d.socials.instagram.url)}" target="_blank" rel="noopener"><img class="icon" src="${IG_ICON}"><div class="n">${fmt(ig)}</div><div class="h">Instagram</div></a>
        <a class="plat" href="${esc(d.socials.tiktok.url)}" target="_blank" rel="noopener"><img class="icon" src="${TT_ICON}"><div class="n">${fmt(tt)}</div><div class="h">TikTok</div></a>
        <a class="plat" href="${esc(d.socials.facebook.url)}" target="_blank" rel="noopener"><img class="icon" src="${FB_ICON}"><div class="n">${fmt(fb)}</div><div class="h">Facebook</div></a>
      </div>
      <p class="about-inline">${esc(d.about)}</p>
      <div class="contactbox">
        <div class="lbl">Work with me</div>
        <div class="name">${esc(d.contactName)}</div>
        <a href="mailto:${esc(d.contactEmail)}">${esc(d.contactEmail)}</a>
      </div>
    </div>
    </div>
  </section>`;

  const cardGrid = (title, items) => `
  <section class="card">
    <h2 class="sec">${esc(title)}</h2>
    <div class="collabs">
      ${items.map(c=>{
        const inner = `<div class="thumb" ${c.img?`style="background-image:url('${esc(c.img)}')"`:""}>${c.img?"":"add image"}</div>`+
                      `<div class="cap"><div class="b">${esc(c.brand)}</div><div class="c">${esc(c.caption)}</div></div>`;
        return c.url
          ? `<a class="collab" href="${esc(c.url)}" target="_blank" rel="noopener">${inner}</a>`
          : `<div class="collab">${inner}</div>`;
      }).join("")}
    </div>
  </section>`;
  // Playable reels: fixed-height iframe embeds (the player letterboxes 9:16
  // correctly). Blocked reels (licensed audio) must NOT go in an iframe -- IG
  // stretches their poster to fill the box. They render as a poster card:
  // baked-in cover image letterboxed on black, linking out to the post.
  const igEmbed = (url) => `<iframe class="ig-embed" src="${esc(url)}embed/" scrolling="no" frameborder="0" allowfullscreen loading="lazy"></iframe>`;
  const igPoster = (c) => `<a class="ig-poster" href="${esc(c.url)}" target="_blank" rel="noopener">
    <div class="media">${c.poster
      ? `<img src="${esc(c.poster)}" alt="Reel cover">`
      : `<div class="ph"><span class="tri">&#9654;</span>Watch on Instagram</div>`}</div>
    <div class="pfoot">Watch on Instagram &#8599;</div>
  </a>`;
  const embedSection = (title, items, cols) => `
  <section class="card">
    <h2 class="sec">${esc(title)}</h2>
    <div class="embeds cols${cols}">
      ${items.map(c=>`<div class="scalebox">${c.blocked ? igPoster(c) : igEmbed(c.url)}</div>`).join("")}
    </div>
  </section>`;
  const collabs = embedSection("Featured Collaborations", d.collabs, 4);
  const topContent = embedSection("Recent Popular Posts", d.topContent, 3);

  const rates = `
  <section class="card">
    <h2 class="sec">Rates</h2>
    <div class="rates-grid">
      ${d.rates.map(r=>`
        <div class="rate">
          <div><div class="rl">${esc(r.label)}</div>${r.sub?`<div class="rs">${esc(r.sub)}</div>`:""}</div>
          <div class="rp">${esc(r.value)}</div>
        </div>`).join("")}
    </div>
    <div class="rate-note">${esc(d.rateNote)}</div>
  </section>`;

  document.getElementById("app").innerHTML =
    header + collabs + topContent + rates +
    `<div class="foot">Rate card for ${esc(d.name)} · ${esc(d.handle)}</div>`;
}
function fitEmbeds(){
  document.querySelectorAll(".scalebox").forEach(box=>{
    const s = box.clientWidth / 480;
    box.style.height = Math.round(735 * s) + "px";
    const inner = box.firstElementChild;
    if(inner) inner.style.transform = `scale(${s})`;
  });
}
render();
fitEmbeds();
window.addEventListener("resize", fitEmbeds);
window.addEventListener("load", fitEmbeds);
</script>
</body>
</html>
