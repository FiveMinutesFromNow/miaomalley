<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mia O'Malley — Coming Soon</title>
<meta name="description" content="An all-new Mia O'Malley is arriving soon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Montserrat:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --coral: #c0492f;
    --cream: #f8f6f2;
    --white: #ffffff;
    --olive: #44513f;
    --rose: #b5655c;
    --rose-deep: #a4564e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: var(--cream);
    border-top: 8px solid var(--coral);
    border-bottom: 8px solid var(--coral);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    font-family: "Montserrat", "Helvetica Neue", Arial, sans-serif;
    color: var(--olive);
  }

  .card {
    background: var(--white);
    max-width: 34rem;
    width: 100%;
    padding: 4rem 2.5rem 3.5rem;
    text-align: center;
    box-shadow: 0 1px 0 rgba(68, 81, 63, 0.06);
    animation: settle 0.9s ease-out both;
  }

  @keyframes settle {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; }
  }

  .wordmark {
    font-size: 0.72rem;
    font-weight: 600;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    margin-bottom: 2.5rem;
  }

  h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 600;
    font-size: clamp(2.1rem, 6vw, 2.9rem);
    line-height: 1.2;
    margin-bottom: 1.4rem;
  }

  .tagline {
    font-family: "Playfair Display", Georgia, serif;
    font-style: italic;
    font-size: 1.05rem;
    line-height: 1.7;
    color: var(--olive);
    opacity: 0.85;
    max-width: 24rem;
    margin: 0 auto 2.5rem;
  }

  .contact {
    display: inline-block;
    background: var(--rose);
    color: var(--white);
    text-decoration: none;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    padding: 0.95rem 2.1rem;
    border-radius: 999px;
    transition: background 0.2s ease;
  }

  .contact:hover { background: var(--rose-deep); }

  .contact:focus-visible {
    outline: 2px solid var(--olive);
    outline-offset: 3px;
  }
</style>
</head>
<body>
  <main class="card">
    <p class="wordmark">Mia O'Malley</p>
    <h1>Website coming soon.</h1>
    <p class="tagline">Let's work to build a world that accommodates all bodies. An all-new Mia O'Malley is arriving soon.</p>
    <a class="contact" href="mailto:collaborate@miaomalley.com">Contact Mia via email</a>
  </main>
</body>
</html>
