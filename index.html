<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mia O'Malley — Fashion, Beauty, Lifestyle Content Creator</title>
<meta name="description" content="Mia O'Malley — fashion, beauty, lifestyle content creator.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Montserrat:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --coral: #c0492f;
    --cream: #f8f6f2;
    --white: #ffffff;
    --olive: #44513f;
    --rose: #b5655c;
    --rose-deep: #a4564e;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: var(--cream);
    border-top: 8px solid var(--coral);
    border-bottom: 8px solid var(--coral);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    font-family: "Montserrat", "Helvetica Neue", Arial, sans-serif;
    color: var(--olive);
  }

  .card {
    background: var(--white);
    max-width: 34rem;
    width: 100%;
    padding: 4rem 2.5rem 3.5rem;
    text-align: center;
    box-shadow: 0 1px 0 rgba(68, 81, 63, 0.06);
    animation: settle 0.9s ease-out both;
  }

  @keyframes settle {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .card { animation: none; }
  }

  h1 {
    font-family: "Playfair Display", Georgia, serif;
    font-weight: 600;
    font-size: clamp(2.4rem, 7vw, 3.4rem);
    line-height: 1.15;
    margin-bottom: 1.1rem;
  }

  .role {
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    opacity: 0.9;
    margin-bottom: 2.5rem;
  }

  .contact {
    display: inline-block;
    background: var(--rose);
    color: var(--white);
    text-decoration: none;
    font-size: 0.7rem;
    font-weight: 600;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    padding: 0.95rem 2.1rem;
    border-radius: 999px;
    transition: background 0.2s ease;
  }

  .contact:hover { background: var(--rose-deep); }

  .contact:focus-visible {
    outline: 2px solid var(--olive);
    outline-offset: 3px;
  }

  .socials {
    margin-top: 2.2rem;
    display: flex;
    justify-content: center;
    gap: 0.9rem;
  }

  .socials a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 2.6rem;
    height: 2.6rem;
    border-radius: 50%;
    border: 1.5px solid var(--olive);
    color: var(--olive);
    transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }

  .socials a:hover {
    background: var(--rose);
    border-color: var(--rose);
    color: var(--white);
  }

  .socials a:focus-visible {
    outline: 2px solid var(--olive);
    outline-offset: 3px;
  }

  .socials svg {
    width: 1.15rem;
    height: 1.15rem;
    fill: currentColor;
  }
</style>
</head>

</html>
